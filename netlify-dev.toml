# Netlify Dev Configuration
# This file ensures secure development environment

[build]
  command = "npm run build"
  publish = "dist"

[dev]
  # Force port 8888 for development
  port = 8888
  # Disable auto-open to prevent security issues
  open = false
  # Enable secure development mode
  secure = true

[functions]
  directory = "netlify/functions"

# Development environment variables
[build.environment]
  NODE_VERSION = "18"
  # Enable secret scanning for enhanced security
  SECRETS_SCAN_ENABLED = "true"
  # Exclude variable names from secret scanning (these are not actual secrets)
  SECRETS_SCAN_OMIT_KEYS = "VITE_GROQ_API_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_SERVICE_ROLE_KEY"
  # Exclude documentation files from secret scanning
  SECRETS_SCAN_OMIT_PATHS = "*.md,docs/**,SUPABASE_SETUP.md,TROUBLESHOOTING.md"

# Security headers for development
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.groq.com;"

