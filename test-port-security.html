<!DOCTYPE html>
<html>
<head>
    <title>Port Security Test</title>
</head>
<body>
    <h1>Port Security Test</h1>
    <div id="results"></div>
    
    <script>
        // Test port security configuration
        const results = document.getElementById('results');
        
        function log(message) {
            results.innerHTML += '<p>' + message + '</p>';
        }
        
        log('Current Port: ' + window.location.port);
        log('Current Host: ' + window.location.hostname);
        
        // Test authentication allowed
        const isAuthAllowed = window.location.port === '8888' || 
                             window.location.hostname !== 'localhost';
        log('Authentication Allowed: ' + isAuthAllowed);
        
        // Test API access allowed  
        const isAPIAllowed = window.location.port === '8888';
        log('API Access Allowed: ' + isAPIAllowed);
        
        if (!isAuthAllowed) {
            log('🚨 SECURITY: This port is blocked for authentication');
        }
        
        if (!isAPIAllowed) {
            log('🚨 SECURITY: This port is blocked for API access');
        }
    </script>
</body>
</html>
